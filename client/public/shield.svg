<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="securaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <path
    d="M50 8 C68 8 84 14 84 32 C84 62 50 88 50 88 C50 88 16 62 16 32 C16 14 32 8 50 8 Z"
    fill="url(#securaGrad)"
    filter="url(#shadow)"
  />

  <!-- Subtle Inner Top Highlight -->
  <path
    d="M50 11 C65 11 80 16 80 32 C80 50 63 68 50 78 C37 68 20 50 20 32 C20 16 35 11 50 11 Z"
    stroke="url(#innerGlow)"
    stroke-width="2"
    fill="none"
  />

  <!-- Cryptographic Vault Lock Ring -->
  <rect x="36" y="44" width="28" height="22" rx="6" fill="#ffffff" />
  
  <!-- Vault Shackle -->
  <path
    d="M42 44 V36 C42 31.5 45.5 28 50 28 C54.5 28 58 31.5 58 36 V44"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Keyhole in Vault -->
  <circle cx="50" cy="53" r="2.8" fill="#1d4ed8" />
  <path d="M48.5 54 L47.5 60 H52.5 L51.5 54 Z" fill="#1d4ed8" />

  <!-- Security Nodes / Stars on Sides -->
  <circle cx="28" cy="38" r="2" fill="#93c5fd" />
  <circle cx="72" cy="38" r="2" fill="#93c5fd" />
  <circle cx="50" cy="20" r="2" fill="#93c5fd" />
</svg>

